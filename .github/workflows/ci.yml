name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and syntax checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies without running package scripts
        run: npm ci --ignore-scripts

      - name: Audit locked dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node -e '
            const fs = require("node:fs");
            const vm = require("node:vm");
            const html = fs.readFileSync("index.html", "utf8");
            const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
            if (!scripts.length) throw new Error("No inline scripts found");
            scripts.forEach(([, source], index) => {
              if (source.trim()) new vm.Script(source, { filename: `index.html:inline-${index + 1}` });
            });
          '
